<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أحمد إيهاب | البطاقة الشخصية الذكية</title>
    <!-- استدعاء خطوط عربية فخمة ومميزة (Amiri و Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body {
            background-color: #121110; /* أسود دافئ ومريح للعين */
            color: #e6dfd3; /* بيج فاتح وناعم للنصوص */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 420px;
            background: #1a1816; /* لون أسود مائل للرمادي الداكن والدافئ للبطاقة */
            border: 2px solid #d4c5a9; /* إطار بيج فخم وواضح */
            border-radius: 28px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #d4c5a9; /* إطار بيج للصورة */
            box-shadow: 0 0 20px rgba(212, 197, 169, 0.2);
            background: #262320;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-family: 'Amiri', serif; /* استخدام خط أميري الفخم للاسم */
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f0e6d2; /* لون بيج مضيء للاسم */
            letter-spacing: 1px;
        }

        p.bio {
            font-size: 14px;
            color: #b5aa96; /* لون بيج هادئ للوصف */
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #24211d; /* لون أسود/بني دافئ للخلفية الخاصة بالأزرار */
            color: #f0e6d2; /* نص بيج دافئ داخل الأزرار */
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s ease;
            border: 1px solid rgba(212, 197, 169, 0.3); /* إطار بيج خفيف */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            border-color: #d4c5a9;
            background: #2f2b26; /* تفتيح بسيط للون الأسود الدافئ عند التحويم */
        }

        /* تخصيص تأثيرات عند التحويم للأيقونات */
        .link-btn.whatsapp:hover { border-color: #25D366; background: rgba(37, 211, 102, 0.12); }
        .link-btn.instagram:hover { border-color: #E1306C; background: rgba(225, 48, 108, 0.12); }

        .link-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-btn i {
            font-size: 22px;
        }

        .whatsapp i { color: #25D366; }
        .instagram i { color: #E1306C; }

        .arrow {
            font-size: 14px;
            color: #b5aa96;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #8c8273; /* لون بيج غامق وخافت للفوتر */
            border-top: 1px solid rgba(212, 197, 169, 0.15);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- صورة الشخص الشخصية -->
        <div class="logo-container">
            <img src="profile.jpeg" alt="Ahmad Ehab" id="c-logo">
        </div>
        
        <!-- اسم الشخص -->
        <h1>أحمد إيهاب</h1>
        
        <!-- نبذة تعريفية قصيرة -->
        <p class="bio">
            مرحباً بك في بطاقتي الشخصية، تواصل معي عبر المنصات أدناه.
        </p>
        
        <!-- أزرار التواصل -->
        <div class="links-list">
            <!-- رابط الواتساب المباشر -->
            <a href="https://wa.me/972522745019" class="link-btn whatsapp" target="_blank">
                <div class="link-content">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>مراسلة عبر الواتساب</span>
                </div>
                <i class="fa-solid fa-angle-left arrow"></i>
            </a>

            <!-- رابط إنستغرام المباشر -->
            <a href="https://instagram.com/ahmad.ehab7" class="link-btn instagram" target="_blank">
                <div class="link-content">
                    <i class="fa-brands fa-instagram"></i>
                    <span>تابعني على إنستغرام</span>
                </div>
                <i class="fa-solid fa-angle-left arrow"></i>
            </a>
        </div>

        <div class="footer">
            Personal Digital Card ⚡
        </div>
    </div>

</body>
</html>
